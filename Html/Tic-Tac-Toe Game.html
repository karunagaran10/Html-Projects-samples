<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the board grid */
        BODY{
    BACKGROUND-IMAGE: URL("queen.jpg");
    BACKGROUNd-REPEAT: NO-REPEAT;
    BACKGROUND-POSITION: CENTER;
    BACKGROUND-ATTACHMENT: FIXED;
    BACKGROUND-SIZE :COVER;
   animation: bgZoom 10s ease-in-out infinite alternate;
   }
        

   h1 {
      color: lch(65.64% 38.74 235.87 / 0.989);
      font-size: 2em;
      margin: 0.5em 0 0.2em 0;
      text-shadow: 2px 2px 8px #fff;
    }
   .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0.5rem; /* Space between cells */
            max-width: 450px; /* Limit board size on large screens */
            width: 90vw; /* Responsive width */
            aspect-ratio: 1 / 1; /* Keep it square */
        }
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #38527d; /* Darker slate background */
            font-size: 3.5rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease-in-out, transform 0.1s ease-in-out;
            border-radius: 0.5rem;
            color: rgb(5, 250, 29);
            box-shadow: 0 4px 6px rgba(255, 0, 230, 0.2);
        }
        .cell:hover:not(.x, .o) {
            background-color: #4a5568; /* Slightly lighter on hover */
        }
        .cell.x { color: #f6ad55; } /* Orange-ish for X */
        .cell.o { color: #63b3ed; } /* Blue-ish for O */
        .cell.winning {
            background-color: #48bb78; /* Green for win */
            color: rgb(234, 255, 3);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
<center>
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-lg">
        <h1 class="text-4xl font-extrabold text-center mb-6 text-yellow-300 tracking-wider">
            Tic-Tac-Toe
        </h1>

        <!-- Status Message -->
        <div id="status-message" class="text-xl font-semibold text-center mb-6 h-8 flex items-center justify-center">
           <h2>Player X's turn!</h2>
                    </div>

        <!-- Game Board -->
        <div id="game-board" class="game-grid mx-auto mb-8">
            <!-- Cells will be dynamically generated by JavaScript -->
        </div>

        <!-- Reset Button -->
        <div class="flex justify-center">
            <button id="reset-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-150 ease-in-out transform hover:scale-105">
                Restart Game
            </button>
        </div>
    </div>
</center>
    <script>
        // Global Game Variables
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        
        // UI Elements
        const boardElement = document.getElementById('game-board');
        const statusMessage = document.getElementById('status-message');
        const resetButton = document.getElementById('reset-button');

        // Winning Combinations (indices of the board array)
        const WINNING_COMBINATIONS = [
            [0, 1, 2], // Horizontal
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6], // Vertical
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8], // Diagonal
            [2, 4, 6]
        ];

        /**
         * Renders the initial board structure and attaches event listeners.
         */
        function renderBoard() {
            boardElement.innerHTML = ''; // Clear existing board
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', handleCellClick);
                boardElement.appendChild(cell);
            }
        }

        /**
         * Handles a click event on a game cell.
         * @param {Event} event The click event.
         */
        function handleCellClick(event) {
            const clickedCell = event.target;
            const clickedCellIndex = parseInt(clickedCell.dataset.index);

            // Guard clauses: Check if game is active or cell is already filled
            if (board[clickedCellIndex] !== '' || !gameActive) {
                return;
            }

            // 1. Update the game state
            board[clickedCellIndex] = currentPlayer;
            clickedCell.textContent = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase());

            // 2. Check for win or draw
            const result = checkWin();
            if (result.winner) {
                handleResult(result.winner, result.combination);
                return;
            }

            // 3. Check for draw
            if (!board.includes('')) {
                handleResult('Draw');
                return;
            }

            // 4. Switch player
            changePlayer();
        }

        /**
         * Checks if the current board state has a winner or is a draw.
         * @returns {object} { winner: 'X'|'O'|null, combination: Array|null }
         */
        function checkWin() {
            for (const combination of WINNING_COMBINATIONS) {
                const [a, b, c] = combination;
                // Check if the three cells are the same and not empty
                if (board[a] !== '' && board[a] === board[b] && board[a] === board[c]) {
                    return { winner: board[a], combination: combination };
                }
            }
            return { winner: null, combination: null };
        }

        /**
         * Handles the end of the game (Win or Draw).
         * @param {string} outcome 'X' | 'O' | 'Draw'
         * @param {Array} combination The winning cell indices (only if win).
         */
        function handleResult(outcome, combination = null) {
            gameActive = false;

            if (outcome === 'Draw') {
                statusMessage.textContent = "Game ended in a DRAW!";
                statusMessage.classList.add('text-gray-400');
            } else {
                statusMessage.textContent = `Player ${outcome} WINS! 🎉`;
                statusMessage.classList.add('text-green-400');
                
                // Highlight the winning combination
                if (combination) {
                    combination.forEach(index => {
                        boardElement.children[index].classList.add('winning');
                    });
                }
            }
        }

        /**
         * Switches the current player and updates the status message.
         */
        function changePlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusMessage.textContent = `Player ${currentPlayer}'s turn!`;
            // Reset colors
            statusMessage.classList.remove('text-green-400', 'text-gray-400');
            statusMessage.classList.add(currentPlayer === 'X' ? 'text-yellow-300' : 'text-blue-400');
        }

        /**
         * Resets the game state and UI to initial conditions.
         */
        function initGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';

            // Clear status message styling and set initial text
            statusMessage.classList.remove('text-green-400', 'text-gray-400', 'text-blue-400');
            statusMessage.classList.add('text-yellow-300');
            statusMessage.textContent = `Player ${currentPlayer}'s turn!`;
            
            // Re-render the board to clear all marks and styles
            renderBoard();
        }

        // --- Event Listeners and Initialization ---
        
        // Setup reset button listener
        resetButton.addEventListener('click', initGame);

        // Initialize the game when the page loads
        window.onload = initGame;

    </script>
</body>
</html>
