<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=01">
  <title>Full-Screen Centered Video</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black; /* Optional: to enhance the video visibility */
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ensures the video covers the entire screen */
    }
  </style>
</head>
<body>
  <video autoplay muted loop>
    <source src="rever.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</body>
</html>
